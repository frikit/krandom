#### Use two appenders, one to log to console, another to log to a file
log4j.rootLogger=DEBUG, STDOUT, R
######### First appender writes to console############
log4j.appender.STDOUT=org.apache.log4j.ConsoleAppender
log4j.appender.STDOUT.layout=org.apache.log4j.PatternLayout
# Pattern to output the caller's file name and line doubleNumber.
log4j.appender.STDOUT.layout.ConversionPattern=%d{MM-dd-yyyy HH:mm} %6p %c{1} - %m%n
########### Second appender writes to a file#########
log4j.appender.R=org.apache.log4j.RollingFileAppender
log4j.appender.R.File=logs/krandom-test.log
# Control the maximum log file userSize
log4j.appender.R.MaxFileSize=5MB<
# Archive log files (one backup file here)
log4j.appender.R.MaxBackupIndex=10
log4j.appender.R.layout=org.apache.log4j.PatternLayout
log4j.appender.R.layout.ConversionPattern=%d{MM-dd-yyyy HH:mm} %p %c - %m%n
