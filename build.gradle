buildscript {
    ext.kotlin_version = '1.3.31'

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

group 'krandom'
version '1.0-SNAPSHOT'

apply plugin: 'base'
apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'kotlin'

sourceCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compile("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version") {
        transitive = false
    }
    compile 'io.github.microutils:kotlin-logging:+'
    compile group: 'org.slf4j', name: 'slf4j-log4j12', version: '+'

    testCompile group: 'org.jetbrains.spek', name: 'spek-api', version: '+'
    testCompile 'org.jetbrains.spek:spek-junit-platform-engine:+'//engine for running spek tests
}

compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}