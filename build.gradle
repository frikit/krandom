buildscript {
    ext.kotlin_version = '1.3.40'

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

version '1.0-SNAPSHOT'

apply plugin: 'base'
apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'kotlin'

sourceCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenLocal()
    mavenCentral()

    jcenter()
}

dependencies {
    //stdlib
    compile("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version")
    compile("org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version")
    compile group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version: "$kotlin_version"

    //logging
    compile 'io.github.microutils:kotlin-logging:+'
    compile 'io.github.microutils:kotlin-logging-common:+'
    compile group: 'org.slf4j', name: 'slf4j-log4j12', version: '+'
    compile group: 'org.slf4j', name: 'slf4j-api', version: '+'

    //spek 1
//    testCompile group: 'org.jetbrains.spek', name: 'spek-api', version: '+'
//    testCompile 'org.jetbrains.spek:spek-junit-platform-engine:+'

    //spek 2
    testCompile group: 'org.spekframework.spek2', name: 'spek-dsl-jvm', version: '+'
    testCompile group: 'org.spekframework.spek2', name: 'spek-runner-junit5', version: '+'

}

compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}

//tasks
clean.doLast {
    List<String> files = [
        "${rootDir}/out/",
        "${rootDir}/logs/"
    ]

    files.each {
        println "Delete [$it]"
        file(it).deleteDir()
    }
}

test {
    useJUnitPlatform {
        includeEngines 'spek2'
    }
}
