buildscript {
    ext.kotlin_version = '1.2.41'

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

group 'krandom'
version '1.0-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'kotlin'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    compile ("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version") {
        transitive = false
    }
    compile 'io.github.microutils:kotlin-logging:1.4.9'
    compile group: 'org.slf4j', name: 'slf4j-log4j12', version: '1.8.0-beta2'

    testCompile group: 'org.jetbrains.spek', name: 'spek-api', version: '1.1.5'
    testCompile 'org.jetbrains.spek:spek-junit-platform-engine:+'//engine for running spek tests
}

compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}