buildscript {
    ext.kotlin_version = '1.3.50'
//    ext.kotlin_ann_version = '13.0'

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

version '1.0-SNAPSHOT'

apply plugin: 'base'
apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'kotlin'

sourceCompatibility = JavaVersion.VERSION_12
targetCompatibility = JavaVersion.VERSION_12

repositories {
    mavenLocal()
    mavenCentral()

    jcenter()
}

dependencies {
    //stdlib
    compile("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version")

    //logging
    compile 'io.github.microutils:kotlin-logging:+'
    compile 'io.github.microutils:kotlin-logging-common:+'
    compile group: 'org.slf4j', name: 'slf4j-log4j12', version: '+'
    compile group: 'org.slf4j', name: 'slf4j-api', version: '+'
    compile group: 'log4j', name: 'log4j', version: '+'

    //spek 2
    testCompile group: 'org.spekframework.spek2', name: 'spek-dsl-jvm', version: '+'
    testCompile group: 'org.spekframework.spek2', name: 'spek-runner-junit5', version: '+'

}

//compileKotlin {
//    kotlinOptions.jvmTarget = "12"
//}
//compileTestKotlin {
//    kotlinOptions.jvmTarget = "12"
//}

//tasks
clean.doLast {
    List<String> files = [
        "${rootDir}/out/",
        "${rootDir}/logs/"
    ]

    files.each {
        println "Delete [$it]"
        file(it).deleteDir()
    }
}

test {
    useJUnitPlatform {
        includeEngines 'spek2'
    }
}
