os: linux
language: java

jobs:
  include:
    - os: linux
      jdk: openjdk8
    - os: linux
      jdk: openjdk13

script: ./gradlew check --info --stacktrace --console=plain --max-workers=1 --no-daemon --no-build-cache -Dkotlin.colors.enabled=false

before_cache:
  - rm -fr $HOME/.gradle/caches/
  - rm -fr $HOME/.gradle/wrapper/

cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/

after_success:
  - bash <(curl -s https://codecov.io/bash)

before_script:
  - chmod +x gradlew
