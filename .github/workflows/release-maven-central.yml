name: release-maven-central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer release version (example: 1.0.0)"
        required: true
        default: "1.0.0"
      publishingType:
        description: "Central Portal publishing type"
        required: true
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED
      resumeGithubRelease:
        description: "Skip Central upload and recreate only a failed GitHub Release after verifying the Central deployment"
        required: true
        type: boolean
        default: false
      releaseCommit:
        description: "Exact commit SHA printed by the initial USER_MANAGED run; required when resuming"
        required: false
        type: string

concurrency:
  group: maven-central-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require the main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must run from refs/heads/main, got ${GITHUB_REF}"
            exit 1
          fi

      - name: Validate release source commit
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ github.event.inputs.releaseCommit }}
          RESUME_GITHUB_RELEASE: ${{ github.event.inputs.resumeGithubRelease }}
        run: |
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "${RESUME_GITHUB_RELEASE}" == "true" ]]; then
            if [[ ! "${REQUESTED_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "releaseCommit must be the exact 40-character SHA printed by the initial run"
              exit 1
            fi
            if [[ "${REQUESTED_COMMIT,,}" != "${CHECKED_OUT_COMMIT}" ]]; then
              echo "main moved after Central upload: expected ${REQUESTED_COMMIT}, got ${CHECKED_OUT_COMMIT}"
              echo "Do not tag a different commit. Repair the GitHub release from the original commit."
              exit 1
            fi
          elif [[ -n "${REQUESTED_COMMIT}" ]]; then
            echo "releaseCommit is only valid with resumeGithubRelease=true"
            exit 1
          fi
          echo "RELEASE_COMMIT=${CHECKED_OUT_COMMIT}" >> "$GITHUB_ENV"

      - name: Validate semver input
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION}"
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "Invalid semver version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Verify release facts
        shell: bash
        env:
          RESUME_GITHUB_RELEASE: ${{ github.event.inputs.resumeGithubRelease }}
        run: |
          MODE=prepare
          if [[ "${RESUME_GITHUB_RELEASE}" == "true" ]]; then
            MODE=resume
          fi
          ./scripts/verify_release_facts.sh "${VERSION}" "${MODE}"

      - name: Validate release tag state
        shell: bash
        env:
          RESUME_GITHUB_RELEASE: ${{ github.event.inputs.resumeGithubRelease }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            if [[ "${RESUME_GITHUB_RELEASE}" != "true" ]]; then
              echo "Tag already exists: ${TAG}"
              exit 1
            fi
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_COMMIT}" != "${RELEASE_COMMIT}" ]]; then
              echo "Existing ${TAG} points to ${TAG_COMMIT}, expected ${RELEASE_COMMIT}"
              exit 1
            fi
            echo "Existing ${TAG} already points to the release commit; recovery may continue."
          fi

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify documentation facts
        run: ./scripts/verify_documentation_facts.sh

      - name: Verify pinned build inputs
        run: ./scripts/verify_build_input_pins.sh

      - name: Build, test, and check
        run: ./gradlew clean build check checkApiContract -PreleaseVersion="${VERSION}" --stacktrace --console=plain --max-workers=1 --no-daemon -x :benchmarks:test -x :benchmarks:check

      # CycloneDX attaches direct-BOM artifacts lazily. Keep SBOM generation in
      # its own Gradle invocation so the build graph cannot consume that variant
      # before the plugin wires its output artifacts.
      - name: Generate and verify release SBOMs
        run: ./gradlew verifyReleaseSboms -PreleaseVersion="${VERSION}" --stacktrace --console=plain --max-workers=1 --no-daemon

      # Assemble before attestation so a provenance failure cannot occur after an
      # AUTOMATIC Central publication. This is the exact signed ZIP uploaded below.
      - name: Assemble signed Maven Central bundle
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew nmcpZipAggregation -PreleaseVersion="${VERSION}" --stacktrace --console=plain --no-daemon

      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/nmcp/zip/aggregation.zip
            core/build/libs/*.jar
            jackson/build/libs/*.jar
            junit/build/libs/*.jar
            spring-boot-starter/build/libs/*.jar
            kotest-extensions/build/libs/*.jar
            kotlin-dsl/build/libs/*.jar
            build/reports/sbom/*.cdx.json
            build/reports/sbom/*.cdx.xml

      # publishingType=USER_MANAGED: artifacts arrive in the portal "Pending"
      # state; you must click "Publish" in the Central Portal UI to release them.
      # publishingType=AUTOMATIC: artifacts release as soon as Sonatype validation
      # passes, no UI step needed.
      - name: Publish to Maven Central (Central Portal)
        if: github.event.inputs.resumeGithubRelease != 'true'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          CENTRAL_PORTAL_PUBLISHING_TYPE: ${{ github.event.inputs.publishingType }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal -PreleaseVersion="${VERSION}" --stacktrace --console=plain --no-daemon

      - name: Await manual Central publication
        if: github.event.inputs.resumeGithubRelease != 'true' && github.event.inputs.publishingType == 'USER_MANAGED'
        run: |
          echo "The signed deployment is uploaded but not yet public."
          echo "Release commit: ${RELEASE_COMMIT}"
          echo "Publish it in Central Portal, then rerun with resumeGithubRelease=true and releaseCommit=${RELEASE_COMMIT}."

      - name: Verify Maven Central publication
        if: github.event.inputs.resumeGithubRelease == 'true'
        shell: bash
        run: |
          POM_URL="https://repo1.maven.org/maven2/io/github/frikit/krandom-core/${VERSION}/krandom-core-${VERSION}.pom"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --output /dev/null "${POM_URL}"
          echo "Verified public Maven Central POM: ${POM_URL}"

      - name: Confirm GitHub Release recovery mode
        if: github.event.inputs.resumeGithubRelease == 'true'
        run: |
          echo "Central upload intentionally skipped."
          echo "Confirm the version is already present in Central Portal before creating the GitHub Release."

      - name: Create GitHub Release
        if: github.event.inputs.publishingType == 'AUTOMATIC' || github.event.inputs.resumeGithubRelease == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true
          target_commitish: ${{ env.RELEASE_COMMIT }}
          files: |
            core/build/libs/*.jar
            jackson/build/libs/*.jar
            junit/build/libs/*.jar
            spring-boot-starter/build/libs/*.jar
            kotest-extensions/build/libs/*.jar
            kotlin-dsl/build/libs/*.jar
            build/nmcp/zip/aggregation.zip
            build/reports/sbom/*.cdx.json
            build/reports/sbom/*.cdx.xml
          body: |
            Published modules:
            - io.github.frikit:krandom-bom:${{ env.VERSION }}
            - io.github.frikit:krandom-core:${{ env.VERSION }}
            - io.github.frikit:krandom-jackson:${{ env.VERSION }}
            - io.github.frikit:krandom-junit:${{ env.VERSION }}
            - io.github.frikit:krandom-spring-boot-starter:${{ env.VERSION }}
            - io.github.frikit:krandom-kotest-extensions:${{ env.VERSION }}
            - io.github.frikit:krandom-kotlin-dsl:${{ env.VERSION }}

            ### Maven Central
            ```kotlin
            implementation("io.github.frikit:krandom-core:${{ env.VERSION }}")
            ```
