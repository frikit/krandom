name: release-maven-central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer release version (example: 1.0.0)"
        required: true
        default: "1.0.0"
      publishingType:
        description: "Central Portal publishing type"
        required: true
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED

permissions:
  contents: write

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate semver input
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "Invalid semver version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Fail if tag already exists
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${TAG}"
            exit 1
          fi

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build, test, and check
        run: ./gradlew clean build check -PreleaseVersion="${VERSION}" --stacktrace --console=plain --max-workers=1 --no-daemon -x :benchmarks:test -x :benchmarks:check

      # Aggregates every published module's signed artifacts (jar, sources, javadoc, POM,
      # module metadata, .asc signatures) into a single zip and uploads it via the
      # Central Portal API at https://central.sonatype.com.
      #
      # publishingType=USER_MANAGED: artifacts arrive in the portal "Pending"
      # state; you must click "Publish" in the Central Portal UI to release them.
      # publishingType=AUTOMATIC: artifacts release as soon as Sonatype validation
      # passes, no UI step needed.
      - name: Publish to Maven Central (Central Portal)
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          CENTRAL_PORTAL_PUBLISHING_TYPE: ${{ github.event.inputs.publishingType }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal -PreleaseVersion="${VERSION}" --stacktrace --console=plain --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            core/build/libs/*.jar
            jackson/build/libs/*.jar
            junit/build/libs/*.jar
            spring-boot-starter/build/libs/*.jar
            kotest-extensions/build/libs/*.jar
            kotlin-dsl/build/libs/*.jar
          body: |
            Published modules:
            - io.github.frikit:krandom-core:${{ env.VERSION }}
            - io.github.frikit:krandom-jackson:${{ env.VERSION }}
            - io.github.frikit:krandom-junit:${{ env.VERSION }}
            - io.github.frikit:krandom-spring-boot-starter:${{ env.VERSION }}
            - io.github.frikit:krandom-kotest-extensions:${{ env.VERSION }}
            - io.github.frikit:krandom-kotlin-dsl:${{ env.VERSION }}

            ### Maven Central
            ```kotlin
            implementation("io.github.frikit:krandom-core:${{ env.VERSION }}")
            ```
