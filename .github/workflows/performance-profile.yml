name: Performance Profile

on:
  workflow_dispatch:

jobs:
  benchmarks:
    name: JMH + Macro Profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run JMH benchmarks
        run: ./gradlew :benchmarks:jmh --no-daemon

      - name: Run macro profile workload
        run: ./gradlew :benchmarks:profileGeneration --no-daemon
