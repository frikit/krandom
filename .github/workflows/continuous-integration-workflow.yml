name: tests + coverage

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Test & Coverage (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify documentation facts
        run: ./scripts/verify_documentation_facts.sh

      - name: Verify pinned build inputs
        run: ./scripts/verify_build_input_pins.sh

      - name: Build and verify
        run: ./gradlew clean build check checkApiContract --stacktrace --console=plain --max-workers=1 --no-daemon -x :benchmarks:test -x :benchmarks:check

      # CycloneDX attaches direct-BOM artifacts lazily. Keep SBOM generation in
      # its own Gradle invocation so the build graph cannot consume that variant
      # before the plugin wires its output artifacts.
      - name: Generate and verify release SBOMs
        run: ./gradlew verifyReleaseSboms --stacktrace --console=plain --max-workers=1 --no-daemon

      - name: Upload coverage to Codecov
        if: matrix.java == '21' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/build/jacoco/jacoco.xml
          fail_ci_if_error: false

  native-image:
    name: GraalVM Native Image Smoke (Java 25)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GraalVM with Native Image
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: '25'
          distribution: graalvm
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and run native-image smoke fixture
        run: ./scripts/verify_native_image.sh

  mutation-pilot:
    name: Schema Mutation Pilot (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Measure schema mutation baseline
        run: ./gradlew :core:pitest --console=plain --max-workers=1 --no-daemon

  examples:
    name: Examples (Local Maven Snapshot)
    runs-on: ubuntu-latest
    env:
      MILL_VERSION: '1.1.6'
      MILL_SHA256: 'af73fadc1fa005e43962bcd529690f448592f4e0786a90b712ac6509378a9eb2'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Scala example tools
        uses: coursier/setup-action@9b7939bf01fd1185ce2babe16135168361bf2c62 # v3
        with:
          apps: sbt

      - name: Install Mill
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}-mill.sh" -o "${HOME}/.local/bin/mill"
          echo "${MILL_SHA256}  ${HOME}/.local/bin/mill" | sha256sum --check --strict
          chmod +x "${HOME}/.local/bin/mill"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Show Scala tool versions
        run: |
          sbt --version
          mill --version

      - name: Make gradle wrappers executable
        run: chmod +x gradlew examples/java-gradle/gradlew examples/kotlin-gradle/gradlew

      - name: Verify examples against the locally published snapshot
        env:
          KRANDOM_REQUIRE_SCALA_TOOLS: "true"
        run: ./scripts/verify_examples_local.sh
