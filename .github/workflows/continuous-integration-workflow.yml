name: Run Kotlin Tests
on: [push]

jobs:
  build:
    name: Run Spek2 Test on Ubuntu(latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Check where I'm
        working-directory: ${{ github.workspace }}
        run: echo $PWD
      - name: Check files in directory
        run: ls -la
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Running tests
        run: ./gradlew test build --info --stacktrace --console=plain --max-workers=1 --no-daemon --build-cache -Dkotlin.colors.enabled=false
