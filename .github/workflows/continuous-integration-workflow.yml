name: tests + coverage

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run; every push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job timeouts are 4-5x the slowest successful runs observed in September 2026 (build 7 min,
# native image 4.5 min, mutation 6 min, examples 6 min), so they only stop hung jobs.
jobs:
  build:
    name: Test & Coverage (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify documentation facts
        run: ./scripts/verify_documentation_facts.sh

      - name: Verify repository Markdown links
        run: ./scripts/verify_markdown_links.sh

      - name: Verify pinned build inputs
        run: ./scripts/verify_build_input_pins.sh

      - name: Build and verify
        run: ./gradlew clean build check --stacktrace --console=plain --max-workers=1 --no-daemon -x :benchmarks:test -x :benchmarks:check

      - name: Verify module boundaries
        run: ./scripts/verify_module_boundaries.sh

      # CycloneDX attaches direct-BOM artifacts lazily. Keep SBOM generation in
      # its own Gradle invocation so the build graph cannot consume that variant
      # before the plugin wires its output artifacts.
      - name: Generate and verify release SBOMs
        run: ./gradlew verifyReleaseSboms --stacktrace --console=plain --max-workers=1 --no-daemon

      - name: Upload coverage to Codecov
        if: matrix.java == '21' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/build/jacoco/jacoco.xml
          fail_ci_if_error: false

  native-image:
    name: GraalVM Native Image Smoke (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up GraalVM with Native Image
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and run native-image smoke fixture
        env:
          KRANDOM_REQUIRE_NATIVE_IMAGE: "true"
        run: ./scripts/verify_native_image.sh

  mutation-pilot:
    name: Critical-path Mutation (Java 21)
    runs-on: ubuntu-latest
    # The object engine, GeneratorConfig and GenerationRecipe joined the mutation targets on
    # 2026-09-27, roughly tripling the analysis (about 7 minutes locally); re-measure on CI.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Measure critical-path mutation baseline
        run: ./gradlew :core:pitest --console=plain --max-workers=1 --no-daemon

  examples:
    name: Examples (Local Maven Snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MILL_VERSION: '1.1.6'
      MILL_SHA256: 'af73fadc1fa005e43962bcd529690f448592f4e0786a90b712ac6509378a9eb2'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Scala example tools
        uses: coursier/setup-action@3174df5c784a0c8724f06b7924b849551c40c39e # v3
        with:
          apps: sbt

      - name: Install Mill
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}-mill.sh" -o "${HOME}/.local/bin/mill"
          echo "${MILL_SHA256}  ${HOME}/.local/bin/mill" | sha256sum --check --strict
          chmod +x "${HOME}/.local/bin/mill"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Show Scala tool versions
        run: |
          sbt --version
          mill --version

      - name: Make gradle wrappers executable
        run: chmod +x gradlew examples/java-gradle/gradlew examples/kotlin-gradle/gradlew

      - name: Verify examples against the locally published snapshot
        env:
          KRANDOM_REQUIRE_SCALA_TOOLS: "true"
        run: ./scripts/verify_examples_local.sh
