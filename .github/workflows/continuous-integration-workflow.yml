name: kt test + coverage
on: [push]

jobs:
  build:
    name: Run Spek2 Test on Ubuntu(latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check where I'm
        working-directory: ${{ github.workspace }}
        run: echo $PWD
      - name: Check files in directory
        run: ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Running tests
        run: ./gradlew clean build check --info --stacktrace --console=plain --max-workers=1 --no-daemon --no-build-cache -Dkotlin.colors.enabled=false
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
