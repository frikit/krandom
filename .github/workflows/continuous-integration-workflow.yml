name: Run Kotlin Tests
on: [push]

jobs:
  build:
    name: Run Spek2 Test on Ubuntu(latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Check where I'm
        working-directory: ${{ github.workspace }}
        run: echo $PWD
      - name: Check files in directory
        run: ls -la
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Running tests Nr. 1
        run: ./gradlew clean check --info --stacktrace --console=plain --max-workers=1 --no-daemon --no-build-cache -Dkotlin.colors.enabled=false
      - name: Running tests Nr. 2
        run: ./gradlew clean check --info --stacktrace --console=plain --max-workers=1 --no-daemon --no-build-cache -Dkotlin.colors.enabled=false
      - name: Running tests Nr. 3
        run: ./gradlew clean check --info --stacktrace --console=plain --max-workers=1 --no-daemon --no-build-cache -Dkotlin.colors.enabled=false
      - name: Running tests Nr. 4
        run: ./gradlew clean check --info --stacktrace --console=plain --max-workers=1 --no-daemon --no-build-cache -Dkotlin.colors.enabled=false
      - name: Running tests Nr. 5
        run: ./gradlew clean check --info --stacktrace --console=plain --max-workers=1 --no-daemon --no-build-cache -Dkotlin.colors.enabled=false
