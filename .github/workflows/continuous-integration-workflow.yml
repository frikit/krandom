name: tests + coverage

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Test & Coverage (Kotest + JUnit 5)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Remove local Java home override
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and verify
        run: ./gradlew clean build check --stacktrace --console=plain --max-workers=1 --no-daemon -x :benchmarks:test -x :benchmarks:check

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/build/jacoco/jacoco.xml
          fail_ci_if_error: false

  examples:
    name: Examples (Local Maven Snapshot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Scala example tools
        uses: coursier/setup-action@v3
        with:
          apps: sbt mill

      - name: Make gradle wrappers executable
        run: chmod +x gradlew examples/java-gradle/gradlew examples/kotlin-gradle/gradlew

      - name: Verify examples against the locally published snapshot
        env:
          KRANDOM_REQUIRE_SCALA_TOOLS: "true"
        run: ./scripts/verify_examples_local.sh
