name: tests + coverage

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Test & Coverage (Kotest + JUnit 5)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and verify
        run: ./gradlew clean build check checkApiContract --stacktrace --console=plain --max-workers=1 --no-daemon -x :benchmarks:test -x :benchmarks:check

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/build/jacoco/jacoco.xml
          fail_ci_if_error: false

  examples:
    name: Examples (Local Maven Snapshot)
    runs-on: ubuntu-latest
    env:
      MILL_VERSION: '1.1.6'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Scala example tools
        uses: coursier/setup-action@v3
        with:
          apps: sbt

      - name: Install Mill
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}-mill.sh" -o "${HOME}/.local/bin/mill"
          chmod +x "${HOME}/.local/bin/mill"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Show Scala tool versions
        run: |
          sbt --version
          mill --version

      - name: Make gradle wrappers executable
        run: chmod +x gradlew examples/java-gradle/gradlew examples/kotlin-gradle/gradlew

      - name: Verify examples against the locally published snapshot
        env:
          KRANDOM_REQUIRE_SCALA_TOOLS: "true"
        run: ./scripts/verify_examples_local.sh
